name: Compilar APK Quicky

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Dependencias Web
        run: npm install --legacy-peer-deps

      - name: Generar Entorno Android NATIVO
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Inyectar Permisos de Cámara e Internet
        run: |
          python -c "
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, 'r') as f:
              content = f.read()
          permissions = '<uses-permission android:name=\"android.permission.CAMERA\" />\n<uses-permission android:name=\"android.permission.INTERNET\" />\n<uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />\n<uses-feature android:name=\"android.hardware.camera\" android:required=\"true\" />'
          content = content.replace('<application', permissions + '\n<application')
          with open(path, 'w') as f:
              f.write(content)
          "

      - name: Compilar APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK Generada
        uses: actions/upload-artifact@v4
        with:
          name: Quicky-Pro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk